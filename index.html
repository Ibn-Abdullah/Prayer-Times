<style>
  :root{
    --bg:#0F1B2D;
    --surface:#17263C;
    --surface-2:#1E3049;
    --accent:#C6A15B;
    --accent-soft:rgba(198,161,91,0.14);
    --text:#E9E4D6;
    --text-muted:#8FA0B8;
    --border:rgba(233,228,214,0.08);
    --shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  html[data-theme="day"]{
    --bg:#EDEAE0;
    --surface:#FBF9F3;
    --surface-2:#F3EFE4;
    --accent:#A8783E;
    --accent-soft:rgba(168,120,62,0.12);
    --text:#24303F;
    --text-muted:#6B7280;
    --border:rgba(36,48,63,0.08);
    --shadow: 0 20px 50px rgba(36,48,63,0.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    transition:background .5s ease, color .5s ease;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .wrap{ width:100%; max-width:620px; }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:22px;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand h1{
    font-family:'Amiri', serif;
    font-weight:700;
    font-size:1.9rem;
    letter-spacing:.5px;
  }
  .brand span{ color:var(--text-muted); font-size:.8rem; }

  .header-actions{ display:flex; gap:10px; flex-shrink:0; }

  .install-btn{
    min-height:44px;
    border-radius:999px;
    border:1px solid var(--accent);
    background:var(--accent);
    color:var(--surface);
    padding:0 16px;
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size:.86rem;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    gap:6px;
    box-shadow:0 10px 28px rgba(0,0,0,0.20);
    transition:transform .3s ease, opacity .3s ease;
    white-space:nowrap;
  }
  .install-btn.show{ display:flex; }
  .install-btn:hover{ transform:translateY(-1px); }
  .install-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .notify-btn{
    min-height:44px;
    border-radius:999px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    padding:0 13px;
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size:.84rem;
    cursor:pointer;
    display:none;
    align-items:center;
    justify-content:center;
    gap:6px;
    white-space:nowrap;
  }
  .notify-btn.active{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }

  .theme-toggle{
    width:44px; height:44px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--accent);
    font-size:1.15rem;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .3s ease, background .4s ease, opacity .3s ease;
    flex-shrink:0;
  }
  .theme-toggle:hover{ transform:scale(1.06); }
  .theme-toggle.muted{ opacity:.4; }
  .theme-toggle:focus-visible, .notify-btn:focus-visible, .location-prompt button:focus-visible, input:focus-visible, .card:focus-visible, .city-item:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  /* ---- Azan alert banner ---- */
  .azan-banner{
    position:fixed;
    left:16px; right:16px; bottom:-120px;
    max-width:588px;
    margin:0 auto;
    background:var(--surface);
    border:1px solid var(--accent);
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
    border-radius:16px;
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    z-index:50;
    transition:bottom .4s ease;
  }
  .azan-banner.show{ bottom:16px; }
  .azan-banner span{
    font-family:'Amiri', serif;
    font-size:1.05rem;
    color:var(--accent);
  }
  .prayer-alarm{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:28px;
    text-align:center;
    background:linear-gradient(160deg, #0878d8, #0c4fa8 55%, #073062);
    color:#fff;
  }
  .prayer-alarm.show{ display:flex; }
  .prayer-alarm-card{
    width:min(100%, 430px);
    border:1px solid rgba(255,255,255,.25);
    border-radius:28px;
    padding:34px 22px;
    background:rgba(255,255,255,.12);
    box-shadow:0 24px 70px rgba(0,0,0,.35);
    backdrop-filter:blur(10px);
  }
  .prayer-alarm h2{ font-family:'Amiri', serif; font-size:2.15rem; margin-bottom:12px; }
  .prayer-alarm .alarm-clock{ font-size:2.6rem; font-weight:900; font-variant-numeric:tabular-nums; margin-bottom:20px; direction:ltr; }
  .prayer-alarm button{
    border:0; border-radius:999px; padding:12px 26px;
    background:#fff; color:#0c4fa8; font-family:'Tajawal', sans-serif;
    font-weight:800; cursor:pointer;
  }

  .azan-banner button{
    background:var(--accent);
    color:var(--surface);
    border:none;
    border-radius:10px;
    padding:8px 18px;
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size:.85rem;
    cursor:pointer;
    flex-shrink:0;
  }

  /* ---- Searchable city box ---- */
  .location-prompt{
    margin-bottom:14px;
    padding:12px 14px;
    border:1px solid var(--accent);
    border-radius:16px;
    background:var(--accent-soft);
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    box-shadow:var(--shadow);
  }
  .location-prompt.show{ display:flex; }
  .location-prompt-text{ display:flex; flex-direction:column; gap:2px; font-size:.9rem; }
  .location-prompt-text b{ color:var(--accent); font-weight:800; }
  .location-prompt-text span{ color:var(--text-muted); font-size:.78rem; line-height:1.5; }
  .location-prompt button{
    border:0;
    border-radius:999px;
    background:var(--accent);
    color:var(--surface);
    padding:9px 14px;
    font-family:'Tajawal', sans-serif;
    font-weight:800;
    cursor:pointer;
    white-space:nowrap;
  }
  .city-row{ margin-bottom:20px; position:relative; }
  .search-box{ position:relative; }
  .search-box svg{
    position:absolute; top:50%; right:16px; transform:translateY(-50%);
    width:16px; height:16px; opacity:.55; pointer-events:none;
  }
  #citySearch{
    width:100%;
    background:var(--surface);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:14px;
    padding:13px 44px 13px 16px;
    font-family:'Tajawal', sans-serif;
    font-size:.95rem;
    box-shadow: var(--shadow);
  }
  #citySearch::placeholder{ color:var(--text-muted); }
  .city-list{
    position:absolute;
    top:calc(100% + 8px);
    right:0; left:0;
    max-height:260px;
    overflow-y:auto;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
    z-index:20;
    display:none;
  }
  .city-list.open{ display:block; }
  .city-item{
    padding:11px 16px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:8px;
    font-size:.92rem;
  }
  .city-item:hover, .city-item.highlighted{ background:var(--accent-soft); }
  .city-item b{ font-weight:500; }
  .city-item span{ color:var(--text-muted); font-size:.78rem; display:inline-flex; align-items:center; gap:4px; }
  .city-item.location-option b, .city-item.location-option span{ color:var(--accent); }
  .city-empty{ padding:14px 16px; color:var(--text-muted); font-size:.85rem; }

  /* ---- Signature: horizon arc ---- */
  .arc-panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:24px;
    padding:26px 20px 18px;
    box-shadow:var(--shadow);
    margin-bottom:22px;
    text-align:center;
  }
  .arc-svg{ width:100%; max-width:460px; height:auto; }
  .arc-track{ fill:none; stroke:var(--border); stroke-width:2; }
  .arc-point circle{ fill:var(--surface-2); stroke:var(--border); stroke-width:1.5; }
  .arc-point.next circle{ fill:var(--accent); stroke:none; }
  .arc-point text{
    fill:var(--text-muted);
    font-family:'Tajawal', sans-serif;
    font-size:11px;
  }
  .arc-point.next text{ fill:var(--accent); font-weight:700; }
  .arc-glyph{
    font-size:15px;
    fill:var(--accent);
  }

  .next-prayer{ margin-top:4px; }
  .next-prayer .label{ color:var(--text-muted); font-size:.85rem; }
  .next-prayer .name{
    font-family:'Amiri', serif;
    font-size:1.7rem;
    color:var(--accent);
    margin:2px 0 6px;
  }
  .countdown{
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size:2.1rem;
    letter-spacing:1px;
    font-variant-numeric: tabular-nums;
  }
  .countdown-label{ color:var(--text-muted); font-size:.78rem; margin-top:2px; }
  .retry-btn{
    margin-top:14px;
    background:var(--accent-soft);
    color:var(--accent);
    border:1px solid var(--accent);
    border-radius:12px;
    padding:9px 20px;
    font-family:'Tajawal', sans-serif;
    font-size:.85rem;
    cursor:pointer;
  }
  .retry-btn:hover{ background:var(--accent); color:var(--surface); }

  /* ---- Prayer grid ---- */
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    margin-bottom:14px;
  }
  .card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px 8px 16px;
    text-align:center;
    transition:border-color .3s ease, background .3s ease;
    overflow:hidden;
  }
  .card.next{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .card.next::after{
    content:"";
    position:absolute;
    left:22%; right:22%; bottom:0;
    height:3px;
    border-radius:3px 3px 0 0;
    background:var(--accent);
    box-shadow:0 0 10px var(--accent);
  }
  .card .p-name{
    font-family:'Amiri', serif;
    font-size:1.05rem;
    margin-bottom:6px;
  }
  .card.next .p-name{ color:var(--accent); }
  .card .p-time{
    font-size:.95rem;
    font-weight:500;
    font-variant-numeric: tabular-nums;
  }
  .card.secondary .p-name{ opacity:.8; }

  footer{
    text-align:center;
    color:var(--text-muted);
    font-size:.78rem;
    line-height:1.9;
  }

  @media (hover:none) and (pointer:coarse) and (max-width:768px){
    .notify-btn{ display:flex; }
  }

  @media (max-width:460px){
    .header-actions{ gap:8px; }
    .install-btn{ padding:0 12px; font-size:.8rem; }
  }

  @media (max-width:380px){
    .brand h1{ font-size:1.6rem; }
    .countdown{ font-size:1.7rem; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>

      <button class="notify-btn" id="notifyBtn" type="button" aria-label="تفعيل تنبيهات الصلاة">🔔 تنبيهات</button>

  <div class="city-row">

    </div>
  </div>

  <div class="arc-panel">

      <text class="arc-glyph" id="arcGlyph" text-anchor="middle"></text>
    </svg>
    <div class="next-prayer">
      <div class="label" id="statusLabel">جاري تحميل المواقيت…</div>
      <div class="name" id="nextName">—</div>
      <div class="countdown" id="countdown">--:--:--</div>
      <div class="countdown-label" id="countdownLabel">متبقٍّ حتى الأذان</div>
      <button id="retryBtn" class="retry-btn" style="display:none">إعادة المحاولة</button>
    </div>
  </div>

  <div class="grid" id="prayerGrid"></div>

  <footer id="footerNote"></footer>

</div>

  function getSavedUserLocation(){
    try{
      const saved = JSON.parse(localStorage.getItem(SAVED_LOCATION_KEY) || "null");
      if(!saved || !Number.isFinite(saved.lat) || !Number.isFinite(saved.lng)) return null;
      return {
        id: USER_LOCATION_ID,
        name: USER_LOCATION_LABEL,
        country: LOCATION_ICON,
        lat: saved.lat,
        lng: saved.lng,
        method: saved.method || getMethodForCoordinates(saved.lat, saved.lng),
        isUserLocation: true
      };
    }catch{
      return null;
    }
  }

  function getMethodForCoordinates(lat, lng){
    const nearest = CITIES.reduce((best, city)=>{
      const distance = Math.hypot(city.lat - lat, city.lng - lng);
      return !best || distance < best.distance ? { city, distance } : best;
    }, null);
    return nearest?.city.method || 3;
  }

  function getLocationChoices(){
    const savedLocation = getSavedUserLocation();
    return savedLocation ? [savedLocation, ...CITIES] : [
      { id: USER_LOCATION_ID, name: USER_LOCATION_LABEL, country: LOCATION_ICON, method: 3, isUserLocation: true },
      ...CITIES
    ];
  }

  function getCityById(id){
    if(id === USER_LOCATION_ID) return getSavedUserLocation();
    return CITIES.find(c=>c.id === id);
  }

    const savedCityId = localStorage.getItem(SAVED_CITY_KEY);
    if(savedCityId === USER_LOCATION_ID && getSavedUserLocation()) return USER_LOCATION_ID;
    return CITIES.some(c=>c.id === savedCityId) ? savedCityId : "cairo";

  // ---------- city search ----------
  function renderCityList(filterText){
    const q = (filterText || "").trim();
    const matches = q
      ? getLocationChoices().filter(c => c.name.includes(q) || c.country.includes(q) || (c.isUserLocation && USER_LOCATION_LABEL.includes(q.toLowerCase())))
      : getLocationChoices();

    el.cityList.innerHTML = "";
    if(matches.length === 0){
      const empty = document.createElement("div");
      empty.className = "city-empty";
      empty.textContent = "لا توجد نتائج";
      el.cityList.appendChild(empty);
      return;
    }
    matches.forEach(c=>{
      const item = document.createElement("div");
      item.className = "city-item" + (c.isUserLocation ? " location-option" : "");
      item.setAttribute("role","option");
      item.tabIndex = 0;
      item.innerHTML = `<b>${c.name}</b><span>${c.isUserLocation ? LOCATION_ICON : c.country}</span>`;
      item.addEventListener("click", ()=> selectCity(c.id));
      item.addEventListener("keydown", e=>{ if(e.key==="Enter") selectCity(c.id); });
      el.cityList.appendChild(item);
    });

      await activateUserLocation({ showLoading:true, timeout:15000 });

    const city = getCityById(id);

    saveCityId(id);
    updateCitySearchValue(city);
    el.cityList.classList.remove("open");

  function setLocationPromptVisible(visible){
    el.locationPrompt.classList.toggle("show", !!visible);
  }

  function requestUserLocation(options = {}){
    if(!("geolocation" in navigator) || !window.isSecureContext){
      setLocationPromptVisible(false);
      return Promise.resolve(null);
    }
    if(options.showLoading){
      el.statusLabel.textContent = "في انتظار إذن تحديد الموقع…";
    }
    return new Promise(resolve=>{
      navigator.geolocation.getCurrentPosition(position=>{
        const lat = Number(position.coords.latitude);
        const lng = Number(position.coords.longitude);
        const method = getMethodForCoordinates(lat, lng);
        const city = { id: USER_LOCATION_ID, name: USER_LOCATION_LABEL, country: LOCATION_ICON, lat, lng, method, isUserLocation: true };
        localStorage.setItem(SAVED_LOCATION_KEY, JSON.stringify({ lat, lng, method, updatedAt: Date.now() }));
        setLocationPromptVisible(false);
        resolve(city);
      }, error=>{
        console.warn("Location permission unavailable:", error);
        if(options.showLoading && state.cityId !== USER_LOCATION_ID) setLoading();
        setLocationPromptVisible(error.code !== error.PERMISSION_DENIED);
        resolve(null);
      }, { enableHighAccuracy:true, timeout:options.timeout || 10000, maximumAge:300000 });
    });
  }

  async function activateUserLocation(options = {}){
    const city = await requestUserLocation({ showLoading:!!options.showLoading, timeout:options.timeout || 10000 });
    if(!city) return false;
    state.cityId = USER_LOCATION_ID;
    saveCityId(USER_LOCATION_ID);
    updateCitySearchValue(city);
    loadTimings();
    return true;
  }

      updateCitySearchValue(savedLocation);
      loadTimings();
      setLocationPromptVisible(false);
      return;
    }

    const fallbackCity = getCityById(state.cityId) || CITIES.find(c=>c.id === "cairo");
    updateCitySearchValue(fallbackCity);
    loadTimings();
    setLocationPromptVisible("geolocation" in navigator && window.isSecureContext);

    activateUserLocation({ timeout:5000 }).then(success=>{
      if(!success && state.cityId !== USER_LOCATION_ID){
        updateCitySearchValue(fallbackCity);
      }
    });
  }

  function fetchJson(url){
    return fetch(url).then(r=>{
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    });
  }


  function formatApiDate(date){
    const day = String(date.getDate()).padStart(2, "0");
    const month = String(date.getMonth() + 1).padStart(2, "0");
    return `${day}-${month}-${date.getFullYear()}`;
  }

  function normalizeTimings(timings){
    return Object.fromEntries(
      Object.entries(timings).map(([key, value])=>[key, String(value).match(/\d{1,2}:\d{2}/)?.[0] || value])
    );
  }

  function loadTimings(){
    const city = getCityById(state.cityId) || CITIES.find(c=>c.id === "cairo");
    if(state._interval) clearInterval(state._interval);
    resetAlert();
    state.lastActiveKey = null;
    setLoading();

    const apiDate = formatApiDate(new Date());
    const directUrl = `https://api.aladhan.com/v1/timings/${apiDate}?latitude=${city.lat}&longitude=${city.lng}&method=${city.method}&school=0&_=${Date.now()}`;
    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(directUrl)}`;

    fetchJson(directUrl)
      .catch(()=> fetchJson(proxyUrl))
      .then(json=>{
        if(json.code !== 200) throw new Error("استجابة غير متوقعة من الخادم");
        state.timings = normalizeTimings(json.data.timings);
        state.hijri = json.data.date.hijri;
        state.gregorian = json.data.date.gregorian;
        render(city);
      })
      .catch(err=>{
        console.error("Prayer times fetch failed:", err);
        setError("تأكد من اتصال الإنترنت ثم اضغط إعادة المحاولة. (" + err.message + ")");
      });
  }

  async function requestNotifications(){
    if(!state.mobileExperience){ // ✅ Mobile only
      alert("التنبيهات متاحة على الموبايل فقط.");
      return;
    }
    if(!("Notification" in window)){
      alert("المتصفح الحالي لا يدعم إشعارات الويب.");
      return;
    }
    const permission = await Notification.requestPermission();
    updateNotifyButton();
    if(permission === "granted"){
      schedulePrayerNotifications();
      const nextName = el.nextName.textContent && el.nextName.textContent !== "—" ? el.nextName.textContent : "الصلاة القادمة";
      showPersistentNextNotification(nextName, el.countdown.textContent);

  function postToServiceWorker(message){
    if(state.swRegistration?.active){
      state.swRegistration.active.postMessage(message);
    }else if(navigator.serviceWorker?.controller){
      navigator.serviceWorker.controller.postMessage(message);
    }

  function showPersistentNextNotification(name, remaining){
    if(!state.mobileExperience || !("Notification" in window) || Notification.permission !== "granted") return; // ✅ Mobile only
    postToServiceWorker({

      title:`الصلاة القادمة: ${name}`,

  function clearPrayerNotificationTimers(){
    state.notificationTimers.forEach(id=>clearTimeout(id));

  function schedulePrayerNotifications(){
    clearPrayerNotificationTimers();
    if(!state.mobileExperience || !state.timings || !("Notification" in window) || Notification.permission !== "granted") return; // ✅ Mobile only
    const now = new Date();
    OBLIGATORY.forEach(key=>{
      const [hours, minutes] = state.timings[key].split(":").map(Number);
      const at = new Date(now);
      at.setHours(hours, minutes, 0, 0);
      if(at <= now) return;
      const prayer = PRAYERS.find(p=>p.key === key);
      const timerId = setTimeout(()=> startAdhanAlert(prayer ? prayer.name : key), at - now);
      state.notificationTimers.push(timerId);
    });
  }

  // ---------- helpers ----------
  function toMinutes(hhmm){
    const [h,m] = hhmm.split(":").map(Number);
    return h*60 + m;
  }

  function to12Hour(hhmm){
    const [h,m] = hhmm.split(":").map(Number);
    const period = h < 12 ? "ص" : "م";
    let h12 = h % 12;
    if(h12 === 0) h12 = 12;
    return `${h12}:${String(m).padStart(2,"0")} ${period}`;
  }

  function nowMinutes(){
    const d = new Date();
    return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60;
  }

  function fmtCountdown(totalSeconds){
    const h = Math.floor(totalSeconds/3600);
    const m = Math.floor((totalSeconds%3600)/60);
    const s = Math.floor(totalSeconds%60);
    const pad = n => String(n).padStart(2,"0");
    return `${pad(h)}:${pad(m)}:${pad(s)}`;
  }

  // ---------- render ----------
  function render(city){
    const t = state.timings;

    const gDate = `${state.gregorian.day} ${state.gregorian.month.en} ${state.gregorian.year}`;
    const hDate = `${state.hijri.day} ${state.hijri.month.ar} ${state.hijri.year}هـ`;
    el.dateLine.textContent = `${gDate} — ${hDate}`;

    el.statusLabel.textContent = "الصلاة القادمة";
    el.countdownLabel.textContent = "متبقٍّ حتى الأذان";
    el.retryBtn.style.display = "none";

    el.grid.innerHTML = "";
    PRAYERS.forEach(p=>{
      const card = document.createElement("div");
      card.className = "card" + (p.secondary ? " secondary" : "");
      card.dataset.key = p.key;
      card.innerHTML = `<div class="p-name">${p.name}</div><div class="p-time">${to12Hour(t[p.key])}</div>`;
      el.grid.appendChild(card);
    });

    const methodName = METHOD_NAMES[city.method] || "طريقة قياسية";
    el.footerNote.innerHTML = city.isUserLocation
      ? `${LOCATION_ICON} ${USER_LOCATION_LABEL} · طريقة الحساب: ${methodName}`
      : `${city.name}، ${city.country} · طريقة الحساب: ${methodName}`;

    persistWidgetData(city);
    buildArc();
    if(state.mobileExperience) schedulePrayerNotifications(); // ✅ Mobile only
    tick();
    if(state._interval) clearInterval(state._interval);
    state._interval = setInterval(tick, 1000);
  }

  function persistWidgetData(city){
    if(!state.mobileExperience || !state.timings) return; // ✅ Mobile only
    const payload = {
      updatedAt: Date.now(),
      city: { id: city.id, name: city.name, country: city.country, lat: city.lat, lng: city.lng, method: city.method, isUserLocation: !!city.isUserLocation },
      timings: state.timings
    };
    localStorage.setItem("prayerTimesWidgetData", JSON.stringify(payload));
  }

  // ---------- arc ----------
  const ARC = { cx:230, cy:210, r:190, startDeg:200, endDeg:-20 };

  function angleForMinute(min, fajrMin, ishaMin){
    const clamped = Math.min(Math.max(min, fajrMin), ishaMin);
    const ratio = (clamped - fajrMin) / (ishaMin - fajrMin);
    return ARC.startDeg + ratio * (ARC.endDeg - ARC.startDeg);
  }

  function pointOnArc(deg){
    const rad = deg * Math.PI / 180;
    return {
      x: ARC.cx + ARC.r * Math.cos(rad),
      y: ARC.cy - ARC.r * Math.sin(rad) * 0.62
    };
  }

  function buildArc(){
    const t = state.timings;
    const fajrMin = toMinutes(t.Fajr);
    const ishaMin = toMinutes(t.Isha);

    const startP = pointOnArc(ARC.startDeg);
    const endP = pointOnArc(ARC.endDeg);

    el.arcTrack.setAttribute("d",
      `M ${startP.x} ${startP.y} Q ${ARC.cx} ${ARC.cy - ARC.r*0.9} ${endP.x} ${endP.y}`);

    el.arcPoints.innerHTML = "";
    PRAYERS.forEach(p=>{
      const min = toMinutes(t[p.key]);
      const deg = angleForMinute(min, fajrMin, ishaMin);
      const pos = pointOnArc(deg);

      const g = document.createElementNS("http://www.w3.org/2000/svg","g");
      g.setAttribute("class","arc-point");
      g.dataset.key = p.key;

      const circle = document.createElementNS("http://www.w3.org/2000/svg","circle");
      circle.setAttribute("cx", pos.x);
      circle.setAttribute("cy", pos.y);
      circle.setAttribute("r", p.secondary ? 5 : 7);
      g.appendChild(circle);

      const label = document.createElementNS("http://www.w3.org/2000/svg","text");
      label.setAttribute("x", pos.x);
      label.setAttribute("y", pos.y - 14);
      label.setAttribute("text-anchor","middle");
      label.textContent = p.name;
      g.appendChild(label);

      el.arcPoints.appendChild(g);
    });
  }

  function updateGlyphPosition(){
    const t = state.timings;
    const fajrMin = toMinutes(t.Fajr);
    const ishaMin = toMinutes(t.Isha);
    const now = nowMinutes();
    const deg = angleForMinute(now, fajrMin, ishaMin);
    const pos = pointOnArc(deg);
    el.arcGlyph.setAttribute("x", pos.x);
    el.arcGlyph.setAttribute("y", pos.y - 22);
    const isDaytime = now >= fajrMin && now <= ishaMin;
    el.arcGlyph.textContent = isDaytime ? "☀" : "☾";
  }

  // ---------- tick ----------
  function tick(){
    const t = state.timings;
    if(!t) return;

    const now = nowMinutes();
    const order = OBLIGATORY.map(key => ({ key, min: toMinutes(t[key]) }));

    let next = order.find(p => p.min > now);
    if(!next){
      next = { key:"Fajr", min: toMinutes(t.Fajr) + 24*60 };
    }

    const diffSeconds = Math.round((next.min - now) * 60);

    const nextObj = PRAYERS.find(p=>p.key === next.key);
    el.nextName.textContent = nextObj ? nextObj.name : "الفجر";
    el.countdown.textContent = fmtCountdown(Math.max(diffSeconds,0));
    
    if(state.mobileExperience && "Notification" in window && Notification.permission === "granted"){ // ✅ Mobile only
      showPersistentNextNotification(nextObj ? nextObj.name : "الفجر", el.countdown.textContent);
    }

    document.querySelectorAll(".card").forEach(c=>{
      c.classList.toggle("next", c.dataset.key === next.key);
    });
    document.querySelectorAll(".arc-point").forEach(g=>{
      g.classList.toggle("next", g.dataset.key === next.key);
    });

    updateGlyphPosition();

    let activeKey = null;
    for(let i=order.length-1;i>=0;i--){
      if(now >= order[i].min){ activeKey = order[i].key; break; }
    }
    if(!activeKey) activeKey = "Isha";

    if(state.mobileExperience && state.lastActiveKey !== null && state.lastActiveKey !== activeKey){ // ✅ Mobile only
      const startedPrayer = PRAYERS.find(p=>p.key === activeKey);
      startAdhanAlert(startedPrayer ? startedPrayer.name : activeKey);
    }
    state.lastActiveKey = activeKey;
  }

  requestLocationOnFirstVisit();
})();

</script>
</body>
</html>
