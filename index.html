<title>مواقيت الصلاة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --bg:#0F1B2D;
    --surface:#17263C;
    --surface-2:#1E3049;
    --accent:#C6A15B;
    --accent-soft:rgba(198,161,91,0.14);
    --text:#E9E4D6;
    --text-muted:#8FA0B8;
    --border:rgba(233,228,214,0.08);
    --shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  html[data-theme="day"]{
    --bg:#EDEAE0;
    --surface:#FBF9F3;
    --surface-2:#F3EFE4;
    --accent:#A8783E;
    --accent-soft:rgba(168,120,62,0.12);
    --text:#24303F;
    --text-muted:#6B7280;
    --border:rgba(36,48,63,0.08);
    --shadow: 0 20px 50px rgba(36,48,63,0.10);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    transition:background .5s ease, color .5s ease;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .wrap{ width:100%; max-width:620px; }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin-bottom:22px;
  }
  .brand{ display:flex; flex-direction:column; gap:2px; }
  .brand h1{
    font-family:'Amiri', serif;
    font-weight:700;
    font-size:1.9rem;
    letter-spacing:.5px;
  }
  .brand span{ color:var(--text-muted); font-size:.8rem; }

  .header-actions{ display:flex; gap:10px; flex-shrink:0; }

  .theme-toggle{
    width:44px; height:44px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--accent);
    font-size:1.15rem;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .3s ease, background .4s ease, opacity .3s ease;
    flex-shrink:0;
  }
  .theme-toggle:hover{ transform:scale(1.06); }
  .theme-toggle.muted{ opacity:.4; }
  .theme-toggle:focus-visible, input:focus-visible, .card:focus-visible, .city-item:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  /* ---- Azan alert banner ---- */
  .azan-banner{
    position:fixed;
    left:16px; right:16px; bottom:-120px;
    max-width:588px;
    margin:0 auto;
    background:var(--surface);
    border:1px solid var(--accent);
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
    border-radius:16px;
    padding:14px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    z-index:50;
    transition:bottom .4s ease;
	   display: none;
  }
  .azan-banner.show{ display: none; }
  .azan-banner span{
    font-family:'Amiri', serif;
    font-size:1.05rem;
    color:var(--accent);
  }
  .azan-banner button{
    background:var(--accent);
    color:var(--surface);
    border:none;
    border-radius:10px;
    padding:8px 18px;
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size:.85rem;
    cursor:pointer;
    flex-shrink:0;
        display: none;

  }

  /* ---- Searchable city box ---- */
  .city-row{ margin-bottom:20px; position:relative; }
  .search-box{ position:relative; }
  .search-box svg{
    position:absolute; top:50%; right:16px; transform:translateY(-50%);
    width:16px; height:16px; opacity:.55; pointer-events:none;
  }
  #citySearch{
    width:100%;
    background:var(--surface);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:14px;
    padding:13px 44px 13px 16px;
    font-family:'Tajawal', sans-serif;
    font-size:.95rem;
    box-shadow: var(--shadow);
  }
  #citySearch::placeholder{ color:var(--text-muted); }
  .city-list{
    position:absolute;
    top:calc(100% + 8px);
    right:0; left:0;
    max-height:260px;
    overflow-y:auto;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
    z-index:20;
    display:none;
  }
  .city-list.open{ display:block; }
  .city-item{
    padding:11px 16px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:8px;
    font-size:.92rem;
  }
  .city-item:hover, .city-item.highlighted{ background:var(--accent-soft); }
  .city-item b{ font-weight:500; }
  .city-item span{ color:var(--text-muted); font-size:.78rem; }
  .city-empty{ padding:14px 16px; color:var(--text-muted); font-size:.85rem; }

  /* ---- Signature: horizon arc ---- */
  .arc-panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:24px;
    padding:26px 20px 18px;
    box-shadow:var(--shadow);
    margin-bottom:22px;
    text-align:center;
  }
  .arc-svg{ width:100%; max-width:460px; height:auto; }
  .arc-track{ fill:none; stroke:var(--border); stroke-width:2; }
  .arc-point circle{ fill:var(--surface-2); stroke:var(--border); stroke-width:1.5; }
  .arc-point.next circle{ fill:var(--accent); stroke:none; }
  .arc-point text{
    fill:var(--text-muted);
    font-family:'Tajawal', sans-serif;
    font-size:11px;
  }
  .arc-point.next text{ fill:var(--accent); font-weight:700; }
  .arc-glyph{
    font-size:15px;
    fill:var(--accent);
  }

  .next-prayer{ margin-top:4px; }
  .next-prayer .label{ color:var(--text-muted); font-size:.85rem; }
  .next-prayer .name{
    font-family:'Amiri', serif;
    font-size:1.7rem;
    color:var(--accent);
    margin:2px 0 6px;
  }
  .countdown{
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size:2.1rem;
    letter-spacing:1px;
    font-variant-numeric: tabular-nums;
  }
  .countdown-label{ color:var(--text-muted); font-size:.78rem; margin-top:2px; }
  .retry-btn{
    margin-top:14px;
    background:var(--accent-soft);
    color:var(--accent);
    border:1px solid var(--accent);
    border-radius:12px;
    padding:9px 20px;
    font-family:'Tajawal', sans-serif;
    font-size:.85rem;
    cursor:pointer;
  }
  .retry-btn:hover{ background:var(--accent); color:var(--surface); }

  /* ---- Prayer grid ---- */
  .grid{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:10px;
    margin-bottom:14px;
  }
  .card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px 8px 16px;
    text-align:center;
    transition:border-color .3s ease, background .3s ease;
    overflow:hidden;
  }
  .card.next{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .card.next::after{
    content:"";
    position:absolute;
    left:22%; right:22%; bottom:0;
    height:3px;
    border-radius:3px 3px 0 0;
    background:var(--accent);
    box-shadow:0 0 10px var(--accent);
  }
  .card .p-name{
    font-family:'Amiri', serif;
    font-size:1.05rem;
    margin-bottom:6px;
  }
  .card.next .p-name{ color:var(--accent); }
  .card .p-time{
    font-size:.95rem;
    font-weight:500;
    font-variant-numeric: tabular-nums;
  }
  .card.secondary .p-name{ opacity:.8; }

  footer{
    text-align:center;
    color:var(--text-muted);
    font-size:.78rem;
    line-height:1.9;
  }

  @media (max-width:380px){
    .brand h1{ font-size:1.6rem; }
    .countdown{ font-size:1.7rem; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <h1>مواقيت الصلاة</h1>
      <span id="dateLine">—</span>
    </div>
    <div class="header-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="تبديل الوضع الليلي والنهاري">☾</button>
    </div>
  </header>

  <div class="azan-banner" id="azanBanner">
    <span id="azanBannerText">حان وقت الصلاة</span>
    <button id="azanStopBtn">إيقاف</button>
  </div>

  <div class="city-row">
    <div class="search-box">
      <input type="text" id="citySearch" placeholder="ابحث عن مدينتك..." autocomplete="off" aria-label="ابحث عن مدينتك">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <div class="city-list" id="cityList" role="listbox"></div>
    </div>
  </div>

  <div class="arc-panel">
    <svg class="arc-svg" viewBox="0 0 460 240" id="arcSvg" aria-hidden="true">
      <path class="arc-track" id="arcTrack"></path>
      <g id="arcPoints"></g>
      <text class="arc-glyph" id="arcGlyph" text-anchor="middle"></text>
    </svg>
    <div class="next-prayer">
      <div class="label" id="statusLabel">جاري تحميل المواقيت…</div>
      <div class="name" id="nextName">—</div>
      <div class="countdown" id="countdown">--:--:--</div>
      <div class="countdown-label" id="countdownLabel">متبقٍّ حتى الأذان</div>
      <button id="retryBtn" class="retry-btn" style="display:none">إعادة المحاولة</button>
    </div>
  </div>

  <div class="grid" id="prayerGrid"></div>

  <footer id="footerNote"></footer>

</div>

    { id:"algiers", name:"الجزائر", country:"الجزائر", lat:36.7538, lng:3.0588, method:19 },

    { id:"tangier", name:"طنجة", country:"المغرب", lat:35.7595, lng:-5.8340, method:21 },

    // ===== موريتانيا =====
    { id:"nouakchott", name:"نواكشوط", country:"موريتانيا", lat:18.0735, lng:-15.9582, method:3 },
    { id:"nouadhibou", name:"نواذيبو", country:"موريتانيا", lat:20.9425, lng:-17.0362, method:3 },

    // ===== الصومال =====
    { id:"mogadishu", name:"مقديشو", country:"الصومال", lat:2.0469, lng:45.3182, method:3 },
    { id:"hargeisa", name:"هرجيسا", country:"الصومال", lat:9.5624, lng:44.0770, method:3 },

    // ===== جيبوتي =====
    { id:"djibouti", name:"جيبوتي", country:"جيبوتي", lat:11.5721, lng:43.1456, method:3 },

    // ===== جزر القمر =====
    { id:"moroni", name:"موروني", country:"جزر القمر", lat:11.7172, lng:43.2473, method:3 }

  ];

  const METHOD_NAMES = {
    3:"رابطة العالم الإسلامي", 4:"أم القرى", 5:"مصر", 8:"دول الخليج",
    9:"الكويت", 10:"قطر", 18:"تونس", 19:"الجزائر", 21:"المغرب", 23:"الأردن"
  };

  // order matters: this is the display order in the grid (sunrise sits right after Fajr)
  const PRAYERS = [
    { key:"Fajr",    name:"الفجر" },
    { key:"Sunrise", name:"الشروق", secondary:true },
    { key:"Dhuhr",   name:"الظهر" },
    { key:"Asr",     name:"العصر" },
    { key:"Maghrib", name:"المغرب" },
    { key:"Isha",    name:"العشاء" }
  ];

  // the five obligatory prayers, used for next-prayer / countdown / alert logic
  const OBLIGATORY = ["Fajr","Dhuhr","Asr","Maghrib","Isha"];

  const state = {
    theme: "night",
    cityId: "cairo",
    timings: null,
    hijri: null,
    gregorian: null,
    _interval: null,
    soundOn: true,
    lastActiveKey: null,
    ringing: false,
    ringTimeout: null,
    activeAudioNodes: []
  };

  const el = {
    themeToggle: document.getElementById("themeToggle"),
    soundToggle: document.getElementById("soundToggle"),
    azanBanner: document.getElementById("azanBanner"),
    azanBannerText: document.getElementById("azanBannerText"),
    azanStopBtn: document.getElementById("azanStopBtn"),
    citySearch: document.getElementById("citySearch"),
    cityList: document.getElementById("cityList"),
    dateLine: document.getElementById("dateLine"),
    nextName: document.getElementById("nextName"),
    countdown: document.getElementById("countdown"),
    grid: document.getElementById("prayerGrid"),
    footerNote: document.getElementById("footerNote"),
    statusLabel: document.getElementById("statusLabel"),
    countdownLabel: document.getElementById("countdownLabel"),
    retryBtn: document.getElementById("retryBtn"),
    arcTrack: document.getElementById("arcTrack"),
    arcPoints: document.getElementById("arcPoints"),
    arcGlyph: document.getElementById("arcGlyph")
  };

  // ---------- theme (night by default) ----------
  function applyTheme(){
    document.documentElement.setAttribute("data-theme", state.theme === "day" ? "day" : "night");
    el.themeToggle.textContent = state.theme === "day" ? "☀" : "☾";
  }
  el.themeToggle.addEventListener("click", ()=>{
    state.theme = state.theme === "day" ? "night" : "day";
    applyTheme();
  });
  applyTheme();

  // ---------- sound toggle ----------
  function applySoundIcon(){
    el.soundToggle.textContent = state.soundOn ? "🔔" : "🔕";
    el.soundToggle.classList.toggle("muted", !state.soundOn);
  }
  el.soundToggle.addEventListener("click", ()=>{
    state.soundOn = !state.soundOn;
    applySoundIcon();
    if(!state.soundOn) stopAdhanAlert();
  });
  applySoundIcon();

  // ---------- audio (synthesized, no copyrighted recordings) ----------
  let audioCtx = null;
  function ensureAudio(){
    if(!audioCtx){
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if(Ctx) audioCtx = new Ctx();
    }
    if(audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }
  document.addEventListener("click", ensureAudio);
  document.addEventListener("touchstart", ensureAudio, { once:true });

  function playTone(freq, startTime, duration, gainPeak){
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, startTime);
    gain.gain.linearRampToValueAtTime(gainPeak, startTime + 0.18);
    gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.05);
    state.activeAudioNodes.push(osc);
    osc.onended = ()=>{
      const i = state.activeAudioNodes.indexOf(osc);
      if(i > -1) state.activeAudioNodes.splice(i,1);
    };
  }

  // a calm, gentle rising-and-falling phrase (original melody, not a recitation)
  function playPhrase(){
    if(!audioCtx) return 0;
    const t0 = audioCtx.currentTime + 0.05;
    const notes = [392.00, 440.00, 523.25, 440.00, 392.00, 329.63];
    let t = t0;
    notes.forEach(f=>{
      playTone(f, t, 1.1, 0.16);
      t += 0.8;
    });
    return t - t0;
  }

  function showBanner(name){
    el.azanBannerText.textContent = `حان وقت صلاة ${name}`;
    el.azanBanner.classList.add("show");
  }
  function hideBanner(){
    el.azanBanner.classList.remove("show");
  }

  function startAdhanAlert(prayerName){
    if(!state.soundOn) return;
    ensureAudio();
    if(!audioCtx) return;
    stopAdhanAlert();
    state.ringing = true;
    showBanner(prayerName);

    let repeats = 0;
    const maxRepeats = 4;
    function loop(){
      if(!state.ringing) return;
      const dur = playPhrase();
      repeats++;
      if(repeats < maxRepeats){
        state.ringTimeout = setTimeout(loop, (dur + 1) * 1000);
      } else {
        state.ringTimeout = setTimeout(stopAdhanAlert, (dur + 0.3) * 1000);
      }
    }
    loop();
  }

  function stopAdhanAlert(){
    state.ringing = false;
    if(state.ringTimeout){ clearTimeout(state.ringTimeout); state.ringTimeout = null; }
    state.activeAudioNodes.forEach(osc=>{ try{ osc.stop(); }catch(e){} });
    state.activeAudioNodes = [];
    hideBanner();
  }

  el.azanStopBtn.addEventListener("click", stopAdhanAlert);

  // ---------- searchable city list ----------
  function renderCityList(filterText){
    const q = (filterText || "").trim();
    const matches = q
      ? CITIES.filter(c => c.name.includes(q) || c.country.includes(q))
      : CITIES;

    el.cityList.innerHTML = "";
    if(matches.length === 0){
      const empty = document.createElement("div");
      empty.className = "city-empty";
      empty.textContent = "لا توجد نتائج";
      el.cityList.appendChild(empty);
      return;
    }
    matches.forEach(c=>{
      const item = document.createElement("div");
      item.className = "city-item";
      item.setAttribute("role","option");
      item.tabIndex = 0;
      item.innerHTML = `<b>${c.name}</b><span>${c.country}</span>`;
      item.addEventListener("click", ()=> selectCity(c.id));
      item.addEventListener("keydown", e=>{ if(e.key==="Enter") selectCity(c.id); });
      el.cityList.appendChild(item);
    });
  }

  function selectCity(id){
    const city = CITIES.find(c=>c.id === id);
    state.cityId = id;
    el.citySearch.value = `${city.name}، ${city.country}`;
    el.cityList.classList.remove("open");
    loadTimings();
  }

  el.citySearch.addEventListener("focus", ()=>{
    el.citySearch.select();
    renderCityList("");
    el.cityList.classList.add("open");
  });
  el.citySearch.addEventListener("input", ()=>{
    renderCityList(el.citySearch.value);
    el.cityList.classList.add("open");
  });
  document.addEventListener("click", e=>{
    if(!e.target.closest(".city-row")){
      el.cityList.classList.remove("open");
    }
  });

  // set initial search box text to default city
  (function initCityBox(){
    const c = CITIES.find(x=>x.id === state.cityId);
    el.citySearch.value = `${c.name}، ${c.country}`;
  })();

  // ---------- fetch ----------
  function setLoading(){
    el.statusLabel.textContent = "جاري تحميل المواقيت…";
    el.nextName.textContent = "—";
    el.countdown.textContent = "--:--:--";
    el.countdownLabel.textContent = "";
    el.retryBtn.style.display = "none";
  }

  function setError(message){
    el.statusLabel.textContent = "تعذّر تحميل المواقيت";
    el.nextName.textContent = "";
    el.countdown.textContent = "";
    el.countdownLabel.textContent = message;
    el.retryBtn.style.display = "inline-block";
  }

  function fetchJson(url){
    return fetch(url).then(r=>{
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    });
  }

  function loadTimings(){
    const city = CITIES.find(c=>c.id === state.cityId);
    if(state._interval) clearInterval(state._interval);
    stopAdhanAlert();
    state.lastActiveKey = null;
    setLoading();

    const directUrl = `https://api.aladhan.com/v1/timings?latitude=${city.lat}&longitude=${city.lng}&method=${city.method}`;
    // Aladhan's API sometimes omits CORS headers for direct browser requests,
    // so if the direct call fails we retry through a CORS-friendly relay.
    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(directUrl)}`;

    fetchJson(directUrl)
      .catch(()=> fetchJson(proxyUrl))
      .then(json=>{
        if(json.code !== 200) throw new Error("استجابة غير متوقعة من الخادم");
        state.timings = json.data.timings;
        state.hijri = json.data.date.hijri;
        state.gregorian = json.data.date.gregorian;
        render(city);
      })
      .catch(err=>{
        console.error("Prayer times fetch failed:", err);
        setError("تأكد من اتصال الإنترنت ثم اضغط إعادة المحاولة. (" + err.message + ")");
      });
  }

  el.retryBtn.addEventListener("click", loadTimings);

  // ---------- helpers ----------
  function toMinutes(hhmm){
    const [h,m] = hhmm.split(":").map(Number);
    return h*60 + m;
  }

  function to12Hour(hhmm){
    const [h,m] = hhmm.split(":").map(Number);
    const period = h < 12 ? "ص" : "م";
    let h12 = h % 12;
    if(h12 === 0) h12 = 12;
    return `${h12}:${String(m).padStart(2,"0")} ${period}`;
  }

  function nowMinutes(){
    const d = new Date();
    return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60;
  }

  function fmtCountdown(totalSeconds){
    const h = Math.floor(totalSeconds/3600);
    const m = Math.floor((totalSeconds%3600)/60);
    const s = Math.floor(totalSeconds%60);
    const pad = n => String(n).padStart(2,"0");
    return `${pad(h)}:${pad(m)}:${pad(s)}`;
  }

  // ---------- render ----------
  function render(city){
    const t = state.timings;

    const gDate = `${state.gregorian.day} ${state.gregorian.month.en} ${state.gregorian.year}`;
    const hDate = `${state.hijri.day} ${state.hijri.month.ar} ${state.hijri.year}هـ`;
    el.dateLine.textContent = `${gDate} — ${hDate}`;

    el.statusLabel.textContent = "الصلاة القادمة";
    el.countdownLabel.textContent = "متبقٍّ حتى الأذان";
    el.retryBtn.style.display = "none";

    // prayer cards (Fajr, Sunrise, Dhuhr, Asr, Maghrib, Isha)
    el.grid.innerHTML = "";
    PRAYERS.forEach(p=>{
      const card = document.createElement("div");
      card.className = "card" + (p.secondary ? " secondary" : "");
      card.dataset.key = p.key;
      card.innerHTML = `<div class="p-name">${p.name}</div><div class="p-time">${to12Hour(t[p.key])}</div>`;
      el.grid.appendChild(card);
    });

    const methodName = METHOD_NAMES[city.method] || "طريقة قياسية";
    el.footerNote.innerHTML = `${city.name}، ${city.country} · طريقة الحساب: ${methodName}`;

    buildArc();
    tick();
    if(state._interval) clearInterval(state._interval);
    state._interval = setInterval(tick, 1000);
  }

  // ---------- arc geometry ----------
  const ARC = { cx:230, cy:210, r:190, startDeg:200, endDeg:-20 };

  function angleForMinute(min, fajrMin, ishaMin){
    const clamped = Math.min(Math.max(min, fajrMin), ishaMin);
    const ratio = (clamped - fajrMin) / (ishaMin - fajrMin);
    return ARC.startDeg + ratio * (ARC.endDeg - ARC.startDeg);
  }

  function pointOnArc(deg){
    const rad = deg * Math.PI / 180;
    return {
      x: ARC.cx + ARC.r * Math.cos(rad),
      y: ARC.cy - ARC.r * Math.sin(rad) * 0.62
    };
  }

  function buildArc(){
    const t = state.timings;
    const fajrMin = toMinutes(t.Fajr);
    const ishaMin = toMinutes(t.Isha);

    const startP = pointOnArc(ARC.startDeg);
    const endP = pointOnArc(ARC.endDeg);

    el.arcTrack.setAttribute("d",
      `M ${startP.x} ${startP.y} Q ${ARC.cx} ${ARC.cy - ARC.r*0.9} ${endP.x} ${endP.y}`);

    el.arcPoints.innerHTML = "";
    PRAYERS.forEach(p=>{
      const min = toMinutes(t[p.key]);
      const deg = angleForMinute(min, fajrMin, ishaMin);
      const pos = pointOnArc(deg);

      const g = document.createElementNS("http://www.w3.org/2000/svg","g");
      g.setAttribute("class","arc-point");
      g.dataset.key = p.key;

      const circle = document.createElementNS("http://www.w3.org/2000/svg","circle");
      circle.setAttribute("cx", pos.x);
      circle.setAttribute("cy", pos.y);
      circle.setAttribute("r", p.secondary ? 5 : 7);
      g.appendChild(circle);

      const label = document.createElementNS("http://www.w3.org/2000/svg","text");
      label.setAttribute("x", pos.x);
      label.setAttribute("y", pos.y - 14);
      label.setAttribute("text-anchor","middle");
      label.textContent = p.name;
      g.appendChild(label);

      el.arcPoints.appendChild(g);
    });
  }

  function updateGlyphPosition(){
    const t = state.timings;
    const fajrMin = toMinutes(t.Fajr);
    const ishaMin = toMinutes(t.Isha);
    const now = nowMinutes();
    const deg = angleForMinute(now, fajrMin, ishaMin);
    const pos = pointOnArc(deg);
    el.arcGlyph.setAttribute("x", pos.x);
    el.arcGlyph.setAttribute("y", pos.y - 22);
    const isDaytime = now >= fajrMin && now <= ishaMin;
    el.arcGlyph.textContent = isDaytime ? "☀" : "☾";
  }

  // ---------- ticking ----------
  function tick(){
    const t = state.timings;
    if(!t) return;

    const now = nowMinutes();
    const order = OBLIGATORY.map(key => ({ key, min: toMinutes(t[key]) }));

    let next = order.find(p => p.min > now);
    if(!next){
      next = { key:"Fajr", min: toMinutes(t.Fajr) + 24*60 };
    }

    const diffSeconds = Math.round((next.min - now) * 60);

    const nextObj = PRAYERS.find(p=>p.key === next.key);
    el.nextName.textContent = nextObj ? nextObj.name : "الفجر";
    el.countdown.textContent = fmtCountdown(Math.max(diffSeconds,0));

    document.querySelectorAll(".card").forEach(c=>{
      c.classList.toggle("next", c.dataset.key === next.key);
    });
    document.querySelectorAll(".arc-point").forEach(g=>{
      g.classList.toggle("next", g.dataset.key === next.key);
    });

    updateGlyphPosition();

    // detect a prayer time that has just started, and ring the alert
    let activeKey = null;
    for(let i=order.length-1;i>=0;i--){
      if(now >= order[i].min){ activeKey = order[i].key; break; }
    }
    if(!activeKey) activeKey = "Isha";

    if(state.lastActiveKey !== null && state.lastActiveKey !== activeKey){
      const startedPrayer = PRAYERS.find(p=>p.key === activeKey);
      startAdhanAlert(startedPrayer ? startedPrayer.name : activeKey);
    }
    state.lastActiveKey = activeKey;
  }

  loadTimings();
})();
