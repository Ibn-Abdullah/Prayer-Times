<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#31d0d8">
<title>ودجت مواقيت الصلاة</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:Arial,'Tajawal',sans-serif;background:transparent;color:#071923} .widget{width:100%;min-height:100vh;padding:10px;background:#31d0d8;border-radius:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 22px rgba(0,0,0,.18)} .top{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:3px solid #071923;padding-bottom:6px}.label{font-size:clamp(16px,5vw,22px);font-weight:700}.count{direction:ltr;text-align:left;font-size:clamp(22px,8vw,34px);font-variant-numeric:tabular-nums}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 14px;font-size:clamp(15px,4.8vw,21px);line-height:1.45}.item{white-space:nowrap}.city{margin-top:auto;text-align:center;font-size:13px;opacity:.75}.error{padding:12px;text-align:center;font-weight:700}
</style>
</head>
<body><main class="widget" id="widget"><div class="top"><div class="label">الصلاة القادمة بعد:</div><div class="count" id="countdown">--:--:--</div></div><div class="grid" id="grid"></div><div class="city" id="city">مواقيت الصلاة</div></main>
<script>
const PRAYERS=[['Fajr','الفجر'],['Sunrise','الشروق'],['Dhuhr','الظهر'],['Asr','العصر'],['Maghrib','المغرب'],['Isha','العشاء']]; const OBLIGATORY=['Fajr','Dhuhr','Asr','Maghrib','Isha'];
const city={name:'القاهرة',country:'مصر',lat:30.0444,lng:31.2357,method:5}; let timings=null;
function toMinutes(x){const [h,m]=x.split(':').map(Number);return h*60+m} function fmt(s){const p=n=>String(Math.floor(n)).padStart(2,'0');return `${p(s/3600)}:${p((s%3600)/60)}:${p(s%60)}`}
function tick(){if(!timings)return;const d=new Date(),now=d.getHours()*60+d.getMinutes()+d.getSeconds()/60;let next=OBLIGATORY.map(k=>({k,min:toMinutes(timings[k])})).find(p=>p.min>now)||{k:'Fajr',min:toMinutes(timings.Fajr)+1440};document.getElementById('countdown').textContent=fmt(Math.max(0,(next.min-now)*60))}
async function load(){try{const r=await fetch(`https://api.aladhan.com/v1/timings?latitude=${city.lat}&longitude=${city.lng}&method=${city.method}`);const j=await r.json();timings=j.data.timings;document.getElementById('grid').innerHTML=PRAYERS.map(([k,n])=>`<div class="item">${n}: ${timings[k]}</div>`).join('');document.getElementById('city').textContent=`${city.name}، ${city.country}`;tick();setInterval(tick,1000)}catch(e){document.getElementById('widget').innerHTML='<div class="error">تعذّر تحميل المواقيت</div>'}}
load();
</script></body></html>
