<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4A8FE7">
<title>ودجت مواقيت الصلاة</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,'Tajawal',sans-serif;background:transparent;color:#fff}
  .widget{width:100%;min-height:100vh;padding:18px 20px;background:linear-gradient(120deg,#3862b9,#58a5f5);border-radius:28px;display:grid;grid-template-columns:1fr auto;gap:18px;box-shadow:0 10px 34px rgba(0,0,0,.28);overflow:hidden}
  .meta{display:flex;flex-direction:column;gap:8px;align-items:flex-start}.icons{display:flex;gap:16px;font-size:24px}.location{font-weight:700;line-height:1.6;opacity:.92}.updated{font-size:13px;opacity:.78}.next{text-align:left;direction:rtl}.next-name{font-size:clamp(25px,7vw,42px);font-weight:800}.count{direction:ltr;font-size:clamp(34px,11vw,58px);font-weight:900;font-variant-numeric:tabular-nums}.prayers{grid-column:1 / -1;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;text-align:center}.item{padding:11px 6px;border-radius:16px;background:rgba(12,43,86,.14)}.item.next{background:rgba(12,43,86,.42);box-shadow:0 8px 22px rgba(0,0,0,.18)}.glyph{font-size:24px;margin-bottom:7px}.name{font-size:clamp(15px,4.4vw,20px)}.time{direction:ltr;margin-top:8px;font-weight:700;font-size:clamp(14px,4vw,18px)}.error{grid-column:1/-1;text-align:center;font-weight:800;padding:18px}
  @media (max-width:420px){.widget{border-radius:22px;padding:14px;gap:12px}.prayers{gap:5px}.item{padding:9px 3px}.glyph{font-size:20px}}
</style>
</head>
<body>
<main class="widget" id="widget">
  <section class="meta">
    <div class="icons"><span>⏰</span><span id="refresh">↻</span></div>
    <div class="location" id="location">مواقيت الصلاة</div>
    <div class="updated" id="updated">—</div>
  </section>
  <section class="next">
    <div class="next-name" id="nextName">—</div>
    <div class="count" id="countdown">--:--:--</div>
  </section>
  <section class="prayers" id="prayers"></section>
</main>
<script>
const PRAYERS=[['Fajr','الفجر','☾'],['Dhuhr','الظهر','☀'],['Asr','العصر','☼'],['Maghrib','المغرب','◒'],['Isha','العشاء','☾']];
const FALLBACK={city:{name:'القاهرة',country:'مصر',lat:30.0444,lng:31.2357,method:5},timings:null};
let widgetData=null;
function toMinutes(x){const [h,m]=x.split(':').map(Number);return h*60+m}
function to12Hour(x){const [h,m]=x.split(':').map(Number);const p=h<12?'ص':'م';let h12=h%12;if(h12===0)h12=12;return `${h12}:${String(m).padStart(2,'0')} ${p}`}
function fmt(s){const p=n=>String(Math.floor(n)).padStart(2,'0');return `${p(s/3600)}:${p((s%3600)/60)}:${p(s%60)}`}
function getSavedData(){try{return JSON.parse(localStorage.getItem('prayerTimesWidgetData'))}catch{return null}}
function findNext(){const d=new Date(),now=d.getHours()*60+d.getMinutes()+d.getSeconds()/60;const list=PRAYERS.map(([key,name])=>({key,name,min:toMinutes(widgetData.timings[key])}));return list.find(p=>p.min>now)||{...list[0],min:list[0].min+1440}}
function render(){if(!widgetData?.timings)return;const next=findNext();document.getElementById('nextName').textContent=`${next.name} خلال`;document.getElementById('location').textContent=`${widgetData.city.name}، ${widgetData.city.country}`;document.getElementById('updated').textContent=`آخر تحديث ${new Date(widgetData.updatedAt||Date.now()).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}`;document.getElementById('prayers').innerHTML=PRAYERS.map(([key,name,glyph])=>`<article class="item ${key===next.key?'next':''}" data-key="${key}"><div class="glyph">${glyph}</div><div class="name">${name}</div><div class="time">${to12Hour(widgetData.timings[key])}</div></article>`).join('');tick()}
function tick(){if(!widgetData?.timings)return;const d=new Date(),now=d.getHours()*60+d.getMinutes()+d.getSeconds()/60,next=findNext();document.getElementById('countdown').textContent=fmt(Math.max(0,(next.min-now)*60));document.querySelectorAll('.item').forEach(item=>item.classList.toggle('next',item.dataset.key===next.key));}
async function load(){try{widgetData=getSavedData();if(!widgetData?.timings){const r=await fetch(`https://api.aladhan.com/v1/timings?latitude=${FALLBACK.city.lat}&longitude=${FALLBACK.city.lng}&method=${FALLBACK.city.method}`);const j=await r.json();widgetData={city:FALLBACK.city,timings:j.data.timings,updatedAt:Date.now()}}render();setInterval(()=>{const previous=findNext().key;tick();if(findNext().key!==previous)render()},1000)}catch(e){document.getElementById('widget').innerHTML='<div class="error">تعذّر تحميل مواقيت الصلاة</div>'}}
document.getElementById('refresh').addEventListener('click',()=>location.reload());
load();
</script>
</body>
</html>
